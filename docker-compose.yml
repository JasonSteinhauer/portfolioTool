# Lokale Entwicklungsumgebung: `docker compose up -d`
# Postgres entspricht der Produktions-DB (Neon, Postgres 16).
# MinIO emuliert Cloudflare R2 (S3-API) – wird ab Inkrement 3 (Medien) genutzt.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: portfolio
      MINIO_ROOT_PASSWORD: portfolio-dev-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
